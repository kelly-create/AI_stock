# ===================================
# A股自选股智能分析系统 - Docker Compose
# ===================================
# 
# 使用方式:
#   定时模式: docker-compose -f ./docker/docker-compose.yml up -d
#   FastAPI模式: docker-compose -f ./docker/docker-compose.yml up -d server
#   同时启动: docker-compose -f ./docker/docker-compose.yml up -d analyzer server

name: daily-stock-analysis
version: '3.8'

x-common: &common
  build:
    context: ..
    dockerfile: docker/Dockerfile
  restart: unless-stopped

  # 环境变量（从 .env 文件加载）。不要将 ../.env 作为单文件 volume 挂载到 /app/.env，
  # 否则 Docker mount point 会阻止配置保存时的 os.replace 原子更新。
  env_file:
    - ../.env

  volumes:
    - ../data:/app/data
    - ../logs:/app/logs
    - ../reports:/app/reports
    - ../strategies:/app/strategies:ro
    # Longbridge OAuth token cache persistence; entrypoint repairs container-side ownership for dsa user.
    # Create ../longbridge_tokens on the host before copying an authorized token cache into it.
    - ../longbridge_tokens:/home/dsa/.longbridge
    # 如需覆盖前端静态资源，可挂载本地 static 目录
    # - ../static:/app/static:ro

  environment: &common-environment
    TZ: Asia/Shanghai
    # Compose uses a one-shot migrator; long-running services must never write DDL.
    DATABASE_MIGRATION_MODE: explicit

    # Web/API service bind address (must be 0.0.0.0 inside container)
    WEBUI_HOST: 0.0.0.0
    # API_PORT 从 .env 文件读取，无需在此硬编码

    # 代理设置（如果需要）
    # http_proxy: http://host.docker.internal:10809
    # https_proxy: http://host.docker.internal:10809
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  # 资源限制：完整分析建议 1G+；512M 仅适合轻量 Web/API、单股、低并发场景，
  # 且建议设置 MAX_WORKERS=1 并避免同时启动 analyzer 和 server。
  deploy:
    resources:
      limits:
        memory: 1G
      reservations:
        memory: 512M

services:
  # 单次迁移：API 与调度进程仅在迁移成功后启动，避免首次 DDL 竞争。
  migrator:
    <<: *common
    container_name: stock-migrator
    command: ["python", "-m", "src.migrations", "--apply"]
    restart: "no"
    healthcheck:
      disable: true

  # 定时任务模式
  analyzer:
    <<: *common
    container_name: stock-analyzer
    depends_on:
      migrator:
        condition: service_completed_successfully
    # Inherit the image's mode-aware healthcheck; scheduler mode verifies the
    # live, non-zombie DSA process without requiring an HTTP endpoint.
    deploy:
      resources:
        limits:
          # This process is Scheduler-only in durable mode, but it still runs
          # full legacy analysis when DURABLE_JOBS_ENABLED=false. Keep the
          # pre-PR1 legacy ceiling instead of making flag-off deployments OOM.
          memory: 1G
        reservations:
          memory: 512M

  # The durable Worker is opt-in; the existing analyzer remains the sole
  # Scheduler process and waits for this Worker's fresh database heartbeat.
  # When Tushare research is enabled this process also holds the SQLite-adjacent
  # *.tushare-owner.lock; any accidental second Worker fails startup immediately.
  worker:
    <<: *common
    profiles: ["durable"]
    container_name: stock-worker
    depends_on:
      migrator:
        condition: service_completed_successfully
    command:
      - python
      - -m
      - src.services.durable_worker
      - --worker-id
      - ${DURABLE_WORKER_ID:-compose-worker}
      - --workers
      - ${DURABLE_WORKER_CONCURRENCY:-3}
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - src.services.durable_worker
        - --healthcheck
        - --worker-id
        - ${DURABLE_WORKER_ID:-compose-worker}
        - --max-heartbeat-age
        - ${DURABLE_WORKER_HEALTH_MAX_AGE_SECONDS:-45}
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 2560M
        reservations:
          memory: 1G

  # FastAPI 模式
  server:
    <<: *common
    container_name: stock-server
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      <<: *common-environment
      # analyzer is the sole schedule owner in both legacy and durable modes.
      DSA_RUNTIME_SCHEDULER_SUPPRESS_START: "true"
    command: ["python", "main.py", "--serve-only", "--host", "0.0.0.0", "--port", "${API_PORT:-8000}"]
    # 若使用 network_mode: host，则以下 ports 映射无效，端口由 command 中的 --port 指定
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    deploy:
      resources:
        limits:
          memory: 1280M
        reservations:
          memory: 512M
